name: mpls-bgp-labeled-unicast

topology:
  defaults:
    kind: linux
    image: wbitt/network-multitool:alpine-minimal
  nodes:
    r1:
      image: quay.io/frrouting/frr:10.4.5
      hostname: r1
      binds:
        - configs/r1/daemons:/etc/frr/daemons
        - configs/r1/frr.conf:/etc/frr/frr.conf
        - configs/r1/90-mpls.conf:/etc/sysctl.d/90-mpls.conf
      exec:
        - sysctl -p /etc/sysctl.d/90-mpls.conf

    r2:
      image: quay.io/frrouting/frr:10.4.5
      hostname: r2
      binds:
        - configs/r2/daemons:/etc/frr/daemons
        - configs/r2/frr.conf:/etc/frr/frr.conf
        - configs/r2/90-mpls.conf:/etc/sysctl.d/90-mpls.conf
      exec:
        - sysctl -p /etc/sysctl.d/90-mpls.conf

    r3:
      image: quay.io/frrouting/frr:10.4.5
      hostname: r3
      binds:
        - configs/r3/daemons:/etc/frr/daemons
        - configs/r3/frr.conf:/etc/frr/frr.conf
        - configs/r3/90-mpls.conf:/etc/sysctl.d/90-mpls.conf
      exec:
        - sysctl -p /etc/sysctl.d/90-mpls.conf
    
    host1:
      hostname: h1
      exec:
        - ip addr add 10.10.10.1/24 dev eth1
        - ip route replace 0/0 via 10.10.10.10

    host2:
      hostname: h2
      exec:
        - ip addr add 20.20.20.1/24 dev eth1
        - ip route replace 0/0 via 20.20.20.10

    host3:
      hostname: h3
      exec:
        - ip addr add 10.10.10.2/24 dev eth1
        - ip route replace 0/0 via 10.10.10.11

    host4:
      hostname: h4
      exec:
        - ip addr add 20.20.20.2/24 dev eth1
        - ip route replace 0/0 via 20.20.20.11
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["host1:eth1", "r1:eth2"]
    - endpoints: ["host2:eth1", "r1:eth3"]
    - endpoints: ["host3:eth1", "r3:eth2"]
    - endpoints: ["host4:eth1", "r3:eth3"]